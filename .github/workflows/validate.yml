name: Validate Debris Registry Entries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate schema itself is well-formed JSON
        run: python -c "import json; json.load(open('data/debris-registry.schema.json'))"

      - name: Validate all example entries against the schema
        run: python tools/validate.py

name: Validate Debris Registry Entries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate schema itself is well-formed JSON
        run: python -c "import json; json.load(open('data/debris-registry.schema.json'))"

      - name: Validate all example entries against the schema
        run: python tools/validate.py

      - name: Check out telemetry-protocol (OTF-1 schema)
        uses: actions/checkout@v4
        with:
          repository: Overby-Industries/telemetry-protocol
          path: telemetry-protocol

      - name: Test the registry <-> OTF-1 bridge
        run: |
          pip install pytest
          OTF1_SCHEMA=telemetry-protocol/schema/otf-1.schema.json python -m pytest -q
